name: Harness Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        env:
          PYTHONPATH: runner
        run: python -m unittest discover -s tests
      - name: Validate smoke payloads
        env:
          PYTHONPATH: runner
        run: python -m gamekit_runner validate-directory payloads/smoke --report artifacts/smoke-validation-report.json
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-validation-report
          path: artifacts/smoke-validation-report.json
